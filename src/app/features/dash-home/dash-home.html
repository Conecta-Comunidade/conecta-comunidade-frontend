<section class="flex min-h-full flex-col gap-4 rounded-2xl bg-slate-50 px-3 py-10 md:gap-8 md:px-6">
  <header class="flex w-full flex-col items-center gap-0.5 md:gap-2">
    <h1 class="text-lg font-bold tracking-tight text-slate-900 md:text-xl">Olá, João Marcos</h1>

    <p class="text-center text-xs text-slate-500 md:text-start md:text-sm">
      Seja bem-vindo ao Sistema de Agendamento de Serviços Comunitários
    </p>
  </header>

  <div class="grid gap-3 md:gap-6 lg:grid-cols-2">
    <section
      class="flex min-h-80 flex-col items-center rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:gap-6"
    >
      <header class="flex items-center justify-between">
        <div class="flex flex-col items-center gap-1">
          <h2 class="tmd:text-xl text-lg font-semibold text-slate-900">Próximos Agendamentos</h2>

          <p class="text-xs text-slate-500 md:text-sm">Acompanhe seus próximos serviços</p>
        </div>
      </header>

      <div class="flex flex-1 flex-col items-center justify-center gap-3 text-center">
        <span class="pi pi-exclamation-circle" style="font-size: 2.5rem"></span>

        <h3 class="w-3/5 text-sm leading-4 font-medium text-slate-800 md:text-base">
          Você ainda não possui nenhum serviço agendado.
        </h3>
      </div>
    </section>

    <section class="flex flex-col gap-2 md:gap-4">
      @for (opcao of opcoesMenuBaseadoNoUsuario; track opcao.rota) {
        <a
          [routerLink]="opcao.rota"
          class="flex h-24 items-center gap-2 rounded-xl border border-slate-200 bg-white p-2 shadow-sm hover:bg-slate-50 md:gap-4 md:p-4"
        >
          <div
            class="flex size-12 items-center justify-center rounded-lg"
            [class]="opcao.iconeClass"
          >
            <span class="pi text-xl" [class]="opcao.icone"></span>
          </div>

          <div class="flex flex-1 flex-col md:gap-1">
            <h3 class="text-sm font-semibold text-slate-900 md:text-base">
              {{ opcao.titulo }}
            </h3>

            <p class="text-xs text-slate-500 md:text-sm">
              {{ opcao.descricao }}
            </p>
          </div>

          <span class="pi pi-chevron-right text-xl text-slate-400"></span>
        </a>
      }
    </section>
  </div>
</section>
