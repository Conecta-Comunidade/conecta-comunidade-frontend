<section class="flex min-h-full flex-col gap-8 rounded-2xl bg-slate-50 px-6 py-10">
  <header class="flex w-full flex-col items-center gap-2">
    <h1 class="text-xl font-bold tracking-tight text-slate-900">Olá, João Marcos</h1>

    <p class="text-sm text-slate-500">
      Seja bem-vindo ao Sistema de Agendamento de Serviços Comunitários
    </p>
  </header>

  <div class="grid gap-6 lg:grid-cols-2">
    <section
      class="flex min-h-80 flex-col items-center gap-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
    >
      <header class="flex items-center justify-between">
        <div class="flex flex-col items-center gap-1">
          <h2 class="text-xl font-semibold text-slate-900">Próximos Agendamentos</h2>

          <p class="text-sm text-slate-500">Acompanhe seus próximos serviços</p>
        </div>
      </header>

      <div class="flex flex-1 flex-col items-center justify-center gap-3 text-center">
        <span class="pi pi-exclamation-circle" style="font-size: 2.5rem"></span>

        <h3 class="w-3/5 font-medium text-slate-800">
          Você ainda não possui nenhum serviço agendado.
        </h3>
      </div>
    </section>

    <section class="flex flex-col gap-4">
      @for (opcao of opcoesMenuBaseadoNoUsuario; track opcao.rota) {
        <a
          [routerLink]="opcao.rota"
          class="flex h-24 items-center gap-4 rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:bg-slate-50"
        >
          <div
            class="flex size-12 items-center justify-center rounded-lg"
            [class]="opcao.iconeClass"
          >
            <span class="pi text-xl" [class]="opcao.icone"></span>
          </div>

          <div class="flex flex-1 flex-col gap-1">
            <h3 class="font-semibold text-slate-900">
              {{ opcao.titulo }}
            </h3>

            <p class="text-sm text-slate-500">
              {{ opcao.descricao }}
            </p>
          </div>

          <span class="pi pi-chevron-right text-xl text-slate-400"></span>
        </a>
      }
    </section>
  </div>
</section>
