<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex h-20 w-full max-w-7xl items-center justify-between px-4 sm:h-24 sm:px-6">
    <a routerLink="/home" class="flex items-center" aria-label="Ir para a página inicial">
      <img src="logo.svg" alt="ConectaComunidade" class="h-14 w-auto object-contain sm:h-20" />
    </a>

    <nav class="flex items-center gap-2">
      <a
        routerLink="/perfil"
        routerLinkActive="bg-blue-50 text-blue-700"
        class="flex items-center gap-2 rounded-lg px-3 py-2 font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 sm:px-4"
      >
        <span class="pi pi-user"></span>

        <span class="hidden min-[400px]:inline">Meu Perfil</span>
      </a>
      <div class="mx-1 hidden h-6 w-px bg-slate-200 sm:block"></div>
      <button
        type="button"
        class="flex cursor-pointer items-center gap-2 rounded-lg bg-blue-400 px-3 py-2 font-semibold text-white transition-colors hover:bg-blue-400/90 sm:px-4"
      >
        <span class="pi pi-sign-out"></span>

        <span class="hidden min-[400px]:inline">Sair</span>
      </button>
    </nav>
  </div>
</header>
